services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "(bundle check || bundle install) && (bin/jobs &) && ./bin/dev -b 0.0.0.0"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - gems:/gems
      - ${OBSIDIAN_VOLUME_PATH:?Set OBSIDIAN_VOLUME_PATH to the absolute host path of the Obsidian vault}:/usr/src/app/obsidian_vault:ro

volumes:
  gems:
