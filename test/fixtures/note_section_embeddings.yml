# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# `embedding` is a vec0 float[2560] column: sqlite-vec accepts a JSON array of
# floats on insert (in addition to a packed binary blob), so we generate one
# per fixture here rather than hand-writing 2560 numbers.

first:
  note_section: first
  embedding: <%= Array.new(2560) { 0.1 }.to_json.inspect %>

second:
  note_section: second
  embedding: <%= Array.new(2560) { -0.1 }.to_json.inspect %>
